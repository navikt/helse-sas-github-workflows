name: Copilot Setup Steps
description: Setter opp standardisert miljø for Copilot-agenter basert på hvilke verktøy som trengs

inputs:
  kotlin:
    description: Støtt Kotlin-prosjekter ved å preinstallere JDK og Gradle
    required: false
    default: "false"
  node:
    description: Støtte Node-prosjekter ved å preinstallere Node.js og pnpm
    required: false
    default: "false"
  package-json:
    description: >-
      Stien til package.json som angir pnpm-versjon (packageManager) og
      Node-versjon (engines.node). Brukes bare når node er true.
    required: false
    default: package.json

runs:
  using: composite
  steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    - if: inputs.kotlin == 'true'
      uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
      with:
        distribution: temurin
        java-version: 25

    - if: inputs.kotlin == 'true'
      uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0

    - if: inputs.node == 'true'
      uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      with:
        package_json_file: ${{ inputs.package-json }}

    - if: inputs.node == 'true'
      uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version-file: ${{ inputs.package-json }}

    - name: Last ned nav-pilot
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        set -euo pipefail
        cd "$(mktemp -d)"
        gh release download --repo navikt/copilot \
          --pattern 'nav-pilot-linux-amd64' --pattern 'SHA256SUMS'
        grep ' nav-pilot-linux-amd64$' SHA256SUMS | sha256sum --check --strict -
        gh attestation verify nav-pilot-linux-amd64 --repo navikt/copilot
        install -m 0755 nav-pilot-linux-amd64 /usr/local/bin/nav-pilot

    - name: Hold Nav-tilpasningene utenfor git
      shell: bash
      run: |
        set -euo pipefail
        cat >> .git/info/exclude <<'EOF'
        /.github/agents/
        /.github/skills/
        /.github/prompts/
        /.github/hooks/
        /.github/instructions/
        /.github/.nav-pilot-state.json
        EOF

    - name: Installer Nav-tilpasninger
      shell: bash
      run: nav-pilot install --repo --all

    # Sletter først staten til nav-pilot, ettersom den nekter å blande sources
    - name: Installer skills fra sas-meta
      shell: bash
      run: |
        set -euo pipefail
        rm -f .github/.nav-pilot-state.json
        nav-pilot install --repo --all --source navikt/helse-sas-meta

    - name: Vis hva som ble installert
      shell: bash
      run: find .github -type f | sort
