name: Copilot Setup Steps

on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/copilot-setup-steps.yml
      - .github/actions/copilot-setup-steps/**
  pull_request:
    paths:
      - .github/workflows/copilot-setup-steps.yml
      - .github/actions/copilot-setup-steps/**

jobs:
  # Jobbnavnet må være copilot-setup-steps, ellers plukker Copilot den ikke opp.
  copilot-setup-steps:
    name: Sett opp miljø for Copilot
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read

    steps:
      # Bruker den lokale versjonen av actionen, så endringer testes før de publiseres.
      # Lokale actions krever at repoet er sjekket ut først.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/copilot-setup-steps
